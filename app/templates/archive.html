<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historische Daten — Reifeschrank</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/archive.css') }}">

    <script src="{{ url_for('static', filename='js/luxon.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chart.umd.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chartjs-adapter-luxon.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/chartjs-plugin-zoom.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/charts_utils.js') }}"></script>
</head>
<body>
    <div class="container">
        <h1>Historische Daten</h1>

        <div class="controls">
            <label for="timeframeSelect">Zeitraum:</label>
            <select id="timeframeSelect">
                <option value="1">Letzte 60 Minuten</option>
                <option value="6">Letzte 6 Stunden</option>
                <option value="12">Letzte 12 Stunden</option>
                <option value="24" selected>Letzte 24 Stunden</option>
                <option value="168">Letzte 7 Tage</option>
                <option value="720">Letzte 30 Tage</option>
                <option value="8760">Alle Daten</option>
            </select>
        </div>

        <div class="chart-section">
            <div class="chart-title-wrapper">
                <h2>Temperatur &amp; Luftfeuchtigkeit</h2>
            </div>
            <div id="tempHumLegend" class="chart-legend"></div>
            <div class="canvas-wrapper">
                <canvas id="tempHumChart"></canvas>
            </div>
        </div>

        <div class="chart-section">
            <div class="chart-title-wrapper">
                <h2>Schaltzustände der Ausgänge</h2>
            </div>
            <div id="relayLegend" class="chart-legend"></div>
            <div class="canvas-wrapper">
                <canvas id="relayChart"></canvas>
            </div>
        </div>

        <a href="{{ url_for('web.index') }}" class="back-button">← Zurück zur Steuerung</a>
    </div>

    <script src="{{ url_for('static', filename='js/archive.js') }}"></script>
</body>
</html>
